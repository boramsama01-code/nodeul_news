name: Apply audited hardening patch

on:
  push:
    branches: ["fix/audit-hardening-2026-10-23"]
    paths:
      - ".github/audit-hardening.patch"
      - ".github/workflows/apply-audit-hardening.yml"

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-hardening-2026-10-23
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply requested patch
        run: git apply --index --whitespace=fix .github/audit-hardening.patch
      - name: Remove one-shot files
        run: git rm .github/audit-hardening.patch .github/workflows/apply-audit-hardening.yml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:standalone
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply audited crawler, lifecycle and admin hardening"
          git push origin HEAD:fix/audit-hardening-2026-10-23
