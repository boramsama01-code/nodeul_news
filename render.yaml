# Free trial; DB expires 30 days after creation, web sleeps after 15 idle minutes.
# Existing nodeul-news-db is reused by name. No paid worker or cron is created.
services:
  - type: web
    name: nodeul-news
    runtime: node
    region: singapore
    plan: free
    repo: https://github.com/boramsama01-code/nodeul_news
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile && pnpm build:standalone
    startCommand: node scripts/start-render.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nodeul-news-db
          property: connectionString
      - key: APP_PASSWORD
        generateValue: true
      - key: CONFIG_ENCRYPTION_KEY
        generateValue: true
      - key: STATE_BACKEND
        value: postgres
      - key: WEB_DIST
        value: artifacts/web/dist/public
      - key: RUN_SCHEDULER
        value: "true"
      - key: CRAWL_INTERVAL_MINUTES
        value: "30"
      - key: IMPORT_ARCHIVE_ONCE
        value: "true"
      - key: DEPLOYMENT_MODE
        value: free-trial
      - key: DATABASE_EXPIRES_AT
        value: "2026-11-21T01:19:59.539382Z"
databases:
  - name: nodeul-news-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
